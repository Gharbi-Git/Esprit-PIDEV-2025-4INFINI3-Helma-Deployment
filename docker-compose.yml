services:
  mysql:
    image: mysql:8.4
    container_name: helma-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: helma
      MYSQL_USER: helma
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - helma_mysql_data:/var/lib/mysql
    networks:
      - helma-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  helma-backend:
    build:
      context: ../helma-backend
      dockerfile: Dockerfile
    container_name: helma-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      AI_MODEL_BASE_URL: ${AI_MODEL_BASE_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      MAILJET_API_KEY: ${MAILJET_API_KEY}
      MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY}
      MAILJET_FROM_EMAIL: ${MAILJET_FROM_EMAIL}
      MAILJET_FROM_NAME: ${MAILJET_FROM_NAME}
    volumes:
      - helma_uploads:/app/uploads
    networks:
      - helma-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  helma-auth-service:
    build:
      context: ../helma-auth-service
      dockerfile: Dockerfile
    container_name: helma-auth-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
    networks:
      - helma-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api-gateway:
    build:
      context: ../helma-api-gateway
      dockerfile: Dockerfile
    container_name: helma-api-gateway
    restart: unless-stopped
    depends_on:
      helma-backend:
        condition: service_healthy
      helma-auth-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
    networks:
      - helma-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    build:
      context: ../helma-frontend
      dockerfile: Dockerfile
    container_name: helma-nginx
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - helma-net

volumes:
  helma_mysql_data:
  helma_uploads:

networks:
  helma-net:
    driver: bridge